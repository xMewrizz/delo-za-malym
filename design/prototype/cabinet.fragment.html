<div id="credit-journey-reference">
<style>
#credit-journey-reference{color-scheme:light dark;}
#credit-journey-reference .cj-app{--cj-bg:light-dark(#f3f4f6,#171b21);--cj-paper:light-dark(#fff,#242932);--cj-ink:light-dark(#22252c,#eff1f5);--cj-muted:light-dark(#606876,#b2b9c6);--cj-line:light-dark(#e1e4e9,#444c59);--cj-soft:light-dark(#f0f2f5,#303743);--cj-red:light-dark(#ce2c25,#ff8076);--cj-tint:light-dark(#fff0ed,#3e2929);--cj-on:light-dark(#fff,#27100e);font:14px/1.5 "Segoe UI",sans-serif;background:var(--cj-bg);color:var(--cj-ink);border-radius:16px;overflow-wrap:anywhere;}
#credit-journey-reference .cj-app *{box-sizing:border-box;}
#credit-journey-reference button,#credit-journey-reference input,#credit-journey-reference select{font:inherit;}
#credit-journey-reference .cj-bar{padding:18px 110px 18px 24px;background:var(--cj-paper);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-radius:16px 16px 0 0;border-bottom:1px solid var(--cj-line);}
#credit-journey-reference .cj-brand{display:flex;gap:10px;align-items:center;font-weight:500;}
#credit-journey-reference .cj-logo{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--cj-red);color:var(--cj-on);}
#credit-journey-reference .cj-muted{color:var(--cj-muted);}
#credit-journey-reference .cj-small{font-size:12px;}
#credit-journey-reference .cj-head{padding:22px 24px 15px;}
#credit-journey-reference h2{font-size:26px;line-height:1.2;font-weight:500;letter-spacing:-.5px;margin:0 0 8px;}
#credit-journey-reference h3{font-size:20px;font-weight:500;margin:0 0 6px;}
#credit-journey-reference h4{font-size:16px;font-weight:500;margin:0 0 6px;}
#credit-journey-reference p{margin:0;}
#credit-journey-reference .cj-steps{display:flex;gap:6px;flex-wrap:wrap;padding:0 24px 16px;}
#credit-journey-reference .cj-step{background:transparent;color:var(--cj-muted);border:0;border-radius:6px;padding:6px 9px;font-size:12px;}
#credit-journey-reference .cj-step.active{background:var(--cj-paper);color:var(--cj-ink);font-weight:500;}
#credit-journey-reference .cj-next{margin:0 24px 18px;background:var(--cj-paper);border-left:3px solid var(--cj-red);padding:12px 15px;border-radius:0 9px 9px 0;}
#credit-journey-reference .cj-next strong{font-weight:500;}
#credit-journey-reference .cj-grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(270px,1fr);gap:18px;align-items:start;padding:0 24px 24px;}
#credit-journey-reference .cj-grid>*{min-width:0;}
#credit-journey-reference .cj-main,#credit-journey-reference .cj-chat{background:var(--cj-paper);border:1px solid var(--cj-line);border-radius:13px;}
#credit-journey-reference .cj-main{padding:22px;}
#credit-journey-reference .cj-chat-head{padding:15px 16px;border-bottom:1px solid var(--cj-line);display:flex;gap:8px;justify-content:space-between;align-items:center;}
#credit-journey-reference .cj-chat-body{padding:16px;display:grid;gap:16px;}
#credit-journey-reference .cj-speaker{font-size:12px;color:var(--cj-muted);margin-bottom:6px;}
#credit-journey-reference .cj-bubble{padding:12px;background:var(--cj-soft);border-radius:9px;}
#credit-journey-reference .cj-badge{display:inline-block;padding:3px 7px;background:var(--cj-soft);color:var(--cj-muted);border-radius:6px;font-size:12px;}
#credit-journey-reference .cj-badge.accent{background:var(--cj-tint);color:var(--cj-red);}
#credit-journey-reference .cj-switch{display:flex;gap:5px;padding:4px;border-radius:9px;background:var(--cj-soft);margin:20px 0;}
#credit-journey-reference .cj-switch button{flex:1;min-width:0;border:0;background:transparent;color:var(--cj-muted);padding:9px;border-radius:6px;}
#credit-journey-reference .cj-switch button[aria-pressed=true]{background:var(--cj-paper);color:var(--cj-ink);}
#credit-journey-reference .cj-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px;}
#credit-journey-reference .cj-tile{text-align:left;border:1px solid var(--cj-line);border-radius:9px;background:var(--cj-paper);color:var(--cj-ink);padding:13px;min-width:0;}
#credit-journey-reference .cj-tile strong{display:block;font-weight:500;}
#credit-journey-reference .cj-tile small{display:block;font-size:12px;color:var(--cj-muted);margin-top:4px;}
#credit-journey-reference .cj-tile[aria-pressed=true]{background:var(--cj-tint);border-color:var(--cj-red);}
#credit-journey-reference .cj-field{display:grid;gap:7px;margin-top:17px;min-width:0;}
#credit-journey-reference .cj-field>span:first-child{font-weight:500;}
#credit-journey-reference input,#credit-journey-reference select{min-width:0;width:100%;padding:10px 11px;background:var(--cj-paper);color:var(--cj-ink);border:1px solid var(--cj-line);border-radius:8px;}
#credit-journey-reference input:disabled{background:var(--cj-soft);color:var(--cj-muted);}
#credit-journey-reference .cj-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
#credit-journey-reference .cj-check{display:flex;gap:8px;align-items:start;margin-top:12px;}
#credit-journey-reference .cj-check input{width:auto;margin-top:4px;}
#credit-journey-reference .cj-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:19px;}
#credit-journey-reference .cj-button{background:var(--cj-paper);border:1px solid var(--cj-line);color:var(--cj-ink);padding:10px 13px;border-radius:8px;}
#credit-journey-reference .cj-button.primary{background:var(--cj-red);border-color:var(--cj-red);color:var(--cj-on);}
#credit-journey-reference .cj-button:disabled{opacity:.45;}
#credit-journey-reference .cj-note{font-size:12px;color:var(--cj-muted);margin-top:10px;}
#credit-journey-reference .cj-box{border:1px solid var(--cj-line);border-radius:10px;padding:15px;margin-top:16px;}
#credit-journey-reference .cj-chat .cj-box{margin-top:0;}
#credit-journey-reference .cj-highlight{background:var(--cj-tint);border-left:3px solid var(--cj-red);padding:11px 13px;margin-top:16px;border-radius:0 7px 7px 0;}
#credit-journey-reference dl{display:grid;gap:10px;margin:14px 0 0;}
#credit-journey-reference dl>div{display:flex;justify-content:space-between;gap:14px;}
#credit-journey-reference dt{color:var(--cj-muted);}
#credit-journey-reference dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;}
#credit-journey-reference .cj-value{font-size:28px;line-height:1.15;font-weight:500;font-variant-numeric:tabular-nums;margin-top:6px;}
#credit-journey-reference .cj-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:17px;}
#credit-journey-reference .cj-compare .cj-value{font-size:23px;}
#credit-journey-reference .cj-list{margin:16px 0 0;padding-left:20px;display:grid;gap:12px;}
#credit-journey-reference .cj-list li::marker{color:var(--cj-muted);}
#credit-journey-reference .cj-file{padding:12px;background:var(--cj-soft);border-radius:8px;margin-top:16px;}
#credit-journey-reference .cj-hint{display:block;color:var(--cj-red);font-size:12px;margin-top:5px;}
#credit-journey-reference .cj-applied{animation:cj-applied .28s ease-out;}
#credit-journey-reference .cj-scenario{animation:cj-scenario .25s ease-out;}
#credit-journey-reference [hidden]{display:none!important;}
#credit-journey-reference details{margin-top:17px;}
#credit-journey-reference summary{color:var(--cj-muted);font-size:12px;}
@keyframes cj-applied{from{box-shadow:0 0 0 3px var(--cj-red);}to{box-shadow:0 0 0 0 transparent;}}
@keyframes cj-scenario{from{transform:translateY(5px);opacity:.5;}to{transform:translateY(0);opacity:1;}}
@media(prefers-reduced-motion:reduce){#credit-journey-reference *{animation:none!important;transition:none!important;}}
@media(max-width:780px){#credit-journey-reference .cj-grid{grid-template-columns:minmax(0,1fr);}#credit-journey-reference .cj-bar{padding-right:24px;}}
@media(max-width:440px){#credit-journey-reference .cj-bar,#credit-journey-reference .cj-head{padding:16px 14px;}#credit-journey-reference .cj-grid{padding:0 14px 14px;}#credit-journey-reference .cj-main{padding:16px;}#credit-journey-reference .cj-next{margin-left:14px;margin-right:14px;}#credit-journey-reference .cj-steps{padding-left:14px;padding-right:14px;}#credit-journey-reference .cj-two,#credit-journey-reference .cj-tiles,#credit-journey-reference .cj-compare{grid-template-columns:minmax(0,1fr);}#credit-journey-reference input,#credit-journey-reference select{font-size:16px;}}
@media(pointer:coarse){#credit-journey-reference button,#credit-journey-reference select,#credit-journey-reference input:not([type=checkbox]){min-height:44px;}}
</style>
<div class="cj-app" aria-label="Референс пути клиента для дизайнера"></div>
<script>
(()=>{
const root=document.getElementById('credit-journey-reference'),app=root.querySelector('.cj-app');
const tasks=[['stock','Закупить товар','Нужна партия для продажи'],['gap','Перекрыть кассовый разрыв','Покупатель заплатит позже'],['equipment','Купить оборудование','Нужны средства на развитие'],['refinance','Снизить нагрузку по долгам','Пересмотреть текущие кредиты'],['contract','Выполнить контракт','Оплатить расходы по заказу'],['other','Другая задача','Расскажите о потребности']];
const products=[['working_capital_loan','Разовый кредит','Одна выдача, возврат по графику'],['overdraft','Овердрафт','Покрывать короткие разрывы на счёте'],['revolving_credit_line','Возобновляемая линия','Пользоваться лимитом повторно'],['investment_loan','Инвестиционный кредит','Вложиться в развитие бизнеса'],['refinancing','Рефинансирование','Заменить текущие кредиты']];
const terms={18:{payment:'66 702,10',total:'1 200 637,88',interest:'200 637,88'},24:{payment:'52 871,10',total:'1 268 906,31',interest:'268 906,31'}};
const state={schema:2,stage:'need',mode:'task',task:'',product:'',amount:'',unknown:false,neededBy:'',recurring:'',term:'',purpose:'',repayDate:'',period:'',ownFunds:'',currentPayment:'',pending:null,applied:false,demo:false,confirmed:false,selectedTerm:18,scenario:false,consent:false,status:'draft',finalSelected:false};
let lastSnapshot='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const duration=n=>n+' '+(n%100>=11&&n%100<=14?'месяцев':n%10===1?'месяц':n%10>=2&&n%10<=4?'месяца':'месяцев');
const btn=(label,action,primary=false,disabled=false)=>`<button type="button" class="cj-button cursor-interaction ${primary?'primary':''}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;
const field=(label,key,type='text',placeholder='')=>`<label class="cj-field"><span>${label}</span><input data-field="${key}" type="${type}" ${type==='number'?`min="${['ownFunds','currentPayment'].includes(key)?'0':key==='period'?'1':'0.01'}" step="${key==='period'?'1':'0.01'}"`:''} value="${esc(state[key])}" placeholder="${placeholder}" ${key==='amount'&&state.unknown?'disabled':''}></label>`;
function select(label,key,options){return `<label class="cj-field"><span>${label}</span><select data-field="${key}"><option value="">Пока не определено</option>${options.map(([value,text])=>`<option value="${value}" ${String(state[key])===String(value)?'selected':''}>${text}</option>`).join('')}</select></label>`;}
const termSelect=()=>select('Желаемый срок возврата','term',[6,12,18,24,36].map(n=>[n,duration(n)]));
const purposeSelect=()=>select('На что пойдут деньги','purpose',[['working_capital','Товар, сырьё, текущие расходы'],['investment','Развитие бизнеса'],['refinancing','Погашение текущих кредитов'],['other','Другая цель']]);
const unknown=()=>`<label class="cj-check cj-small cj-muted"><input type="checkbox" data-toggle="unknown" ${state.unknown?'checked':''}>Пока не знаю точную сумму</label>`;
const title=()=>state.mode==='task'?tasks.find(t=>t[0]===state.task)?.[1]:products.find(p=>p[0]===state.product)?.[1];
const complete=()=>Boolean((state.mode==='task'?state.task:state.product)&&(state.unknown||(state.amount.trim()!==''&&Number.isFinite(Number(state.amount))&&Number(state.amount)>0)));
function example(){const id=state.mode==='task'?'task':state.product||'working_capital_loan';return ({task:{message:'Нужен миллион на закупку товара. Вернуть хочу за год.',values:{task:'stock',amount:'1000000',term:'12'},rows:[['Задача','Закупка товара'],['Сумма','1 000 000 ₽'],['Желаемый срок','12 месяцев']]},working_capital_loan:{message:'Хочу разовый кредит: миллион на товар на год.',values:{product:'working_capital_loan',amount:'1000000',term:'12',purpose:'working_capital'},rows:[['Продукт','Разовый кредит'],['Сумма','1 000 000 ₽'],['Срок','12 месяцев']]},overdraft:{message:'Хочу овердрафт с лимитом миллион для оплаты поставщикам.',values:{product:'overdraft',amount:'1000000',purpose:'working_capital'},rows:[['Продукт','Овердрафт'],['Лимит','1 000 000 ₽'],['Цель','Оплата поставщикам']]},revolving_credit_line:{message:'Нужна линия на миллион на полгода для повторных закупок.',values:{product:'revolving_credit_line',amount:'1000000',period:'6',recurring:'true',purpose:'working_capital'},rows:[['Лимит','1 000 000 ₽'],['Доступ к линии','6 месяцев'],['Использование','Повторные закупки']]},investment_loan:{message:'Нужен миллион в кредит на оборудование. Своих средств 200 тысяч.',values:{product:'investment_loan',amount:'1000000',ownFunds:'200000',purpose:'investment'},rows:[['Финансирование','1 000 000 ₽'],['Собственные средства','200 000 ₽'],['Цель','Оборудование']]},refinancing:{message:'Хочу рефинансировать долг миллион на полтора года. Сейчас плачу 80 тысяч в месяц.',values:{product:'refinancing',amount:'1000000',currentPayment:'80000',term:'18',purpose:'refinancing'},rows:[['Остаток долга','1 000 000 ₽'],['Текущий платёж','80 000 ₽ / мес.'],['Желаемый срок','18 месяцев']]}})[id];}
function save(){const snapshot={...state,applied:false};lastSnapshot=JSON.stringify(snapshot);if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:'Путь клиента — два входа, предложения и статус',stage:state.stage,mode:state.mode,product:state.product||null,task:state.task||null,status:state.status,selectedTerm:state.selectedTerm},privateContent:{journey:snapshot}}).catch(()=>{});}
function restore(value){const old=value?.privateContent?.journey;if(!old||old.schema!==2||JSON.stringify(old)===lastSnapshot)return;for(const key of ['task','product','amount','neededBy','recurring','term','purpose','repayDate','period','ownFunds','currentPayment'])if(typeof old[key]==='string')state[key]=old[key].slice(0,100);if(['need','business','finance','offers','review','status'].includes(old.stage))state.stage=old.stage;if(['task','product'].includes(old.mode))state.mode=old.mode;for(const key of ['unknown','demo','confirmed','scenario','consent','finalSelected'])if(typeof old[key]==='boolean')state[key]=old[key];if([18,24].includes(old.selectedTerm))state.selectedTerm=old.selectedTerm;if(['draft','submitted','under_review','offers_ready','ready_to_sign'].includes(old.status))state.status=old.status;state.pending=old.pending&&old.pending.mode===state.mode?{mode:state.mode}:null;state.applied=false;}
function productFields(){const id=state.product;if(!id)return '<div class="cj-note">Выберите продукт — появятся его параметры.</div>';
let inputs='';
if(id==='working_capital_loan')inputs=`<div class="cj-two">${field('Сумма кредита, ₽','amount','number','Например, 1 000 000')}${termSelect()}</div>${unknown()}${purposeSelect()}`;
if(id==='overdraft')inputs=`<div class="cj-two">${field('Желаемый лимит, ₽','amount','number')}${field('Когда ожидаете поступление денег','repayDate','date')}</div>${unknown()}${purposeSelect()}<div class="cj-note">Лимит на счёте используется при нехватке денег. Срок отдельного разрыва уточняется по поступлениям.</div>`;
if(id==='revolving_credit_line')inputs=`<div class="cj-two">${field('Желаемый лимит, ₽','amount','number')}${field('На сколько месяцев нужен доступ к линии','period','number')}</div>${unknown()}${select('Как планируете использовать лимит','recurring',[['true','Повторные закупки или платежи'],['false','Одна потребность']])}${purposeSelect()}`;
if(id==='investment_loan')inputs=`<div class="cj-two">${field('Сколько требуется в кредит, ₽','amount','number')}${field('Собственные средства на проект, ₽','ownFunds','number')}</div>${unknown()}${field('Когда планируете запустить проект','neededBy','date')}${termSelect()}`;
if(id==='refinancing')inputs=`${field('Остаток долга для погашения, ₽','amount','number')}${unknown()}<div class="cj-two">${field('Текущие платежи в месяц, ₽','currentPayment','number')}${termSelect()}</div><div class="cj-note">Договоры и графики выбранных долгов уточняются на этапе документов.</div>`;
return `<div class="cj-box"><span class="cj-badge">Параметры продукта</span><h4 style="margin-top:10px">${esc(products.find(p=>p[0]===id)?.[1])}</h4>${inputs}</div>${id!=='working_capital_loan'?'<div class="cj-note">Пример структуры формы. Расчёт этой механики в прототипе не подключён.</div>':''}`;
}
function need(){return `<div class="cj-switch" role="group" aria-label="Как начать"><button type="button" class="cursor-interaction" data-mode="task" aria-pressed="${state.mode==='task'}">Подобрать под задачу</button><button type="button" class="cursor-interaction" data-mode="product" aria-pressed="${state.mode==='product'}">Я знаю продукт</button></div>${state.mode==='task'?`<h3>Что нужно вашему бизнесу?</h3><p class="cj-muted cj-small">Расскажите о задаче. Механику финансирования подберём после уточнений.</p><div class="cj-tiles">${tasks.map(([id,label,sub])=>`<button type="button" class="cj-tile cursor-interaction" data-task="${id}" aria-pressed="${state.task===id}"><strong>${label}</strong><small>${sub}</small></button>`).join('')}</div><div class="cj-two">${field('Сколько нужно для задачи, ₽','amount','number','Например, 1 000 000')}${field('Когда нужны деньги','neededBy','date')}</div>${unknown()}${select('Такая потребность возникает','recurring',[['false','Разово'],['true','Регулярно']])}`:`<h3>Какой продукт хотите оформить?</h3><p class="cj-muted cj-small">Выберите механику и задайте её параметры. Доступность проверим по данным бизнеса.</p><div class="cj-tiles">${products.map(([id,label,sub])=>`<button type="button" class="cj-tile cursor-interaction" data-product="${id}" aria-pressed="${state.product===id}"><strong>${label}</strong><small>${sub}</small></button>`).join('')}</div>${productFields()}`}${state.pending?'<div class="cj-highlight" role="status">Есть предложение помощника. Значения ещё не применены.</div>':''}<div class="cj-actions">${btn('Продолжить к данным бизнеса','continue',true,!complete())}</div><div class="cj-note">Сохраняется черновик. Заявка ещё не отправлена.</div>`;}
function business(){return `<h3>Данные бизнеса</h3><p class="cj-muted cj-small">${esc(title()||'Потребность')} · ${state.unknown?'сумма уточняется':Number(state.amount).toLocaleString('ru-RU')+' ₽'}</p><div class="cj-box"><h4>ООО «Север»</h4><dl><div><dt>Форма</dt><dd>ООО</dd></div><div><dt>Деятельность</dt><dd>Оптовая торговля</dd></div><div><dt>Возраст бизнеса</dt><dd>3 года</dd></div></dl><div class="cj-note">Вымышленная компания для демонстрации.</div></div><div class="cj-actions">${btn('Открыть пример финансов','demo',true)}${btn('Изменить потребность','back-need')}</div><div class="cj-note">Пример заменит параметры черновика: закупка товара, 1 000 000 ₽ на 12 месяцев.</div>`;}
function finance(){return `<h3>Финансы и документы</h3><p class="cj-muted cj-small">Проверьте извлечённые сведения перед расчётом.</p><div class="cj-file"><strong style="font-weight:500">Выписка ООО «Север» · пример</strong><div class="cj-small cj-muted">Источник: синтетические данные · последние 6 полных месяцев</div></div><dl><div><dt>Поступления в месяц</dt><dd>1 000 000 ₽</dd></div><div><dt>Расходы в месяц</dt><dd>800 000 ₽</dd></div><div><dt>Налоги в месяц</dt><dd>50 000 ₽</dd></div><div><dt>Текущие платежи</dt><dd>35 000 ₽ / мес.</dd></div></dl><div class="cj-note">В примере показатели одинаковы во всех шести месяцах.</div><div class="cj-two">${field('Требуется на закупку, ₽','amount','number')}${termSelect()}</div><label class="cj-check"><input type="checkbox" data-toggle="confirmed" ${state.confirmed?'checked':''}><span>Проверил сведения примера и подтверждаю их для расчёта</span></label><div class="cj-actions">${btn('Посмотреть предложения','offers',true,!state.confirmed||state.amount!=='1000000'||state.term!=='12')}${btn('К данным бизнеса','back-business')}</div><div class="cj-note">Этот референс показывает фиксированный пример: 1 000 000 ₽ на 12 месяцев. Произвольные параметры здесь не рассчитываются.</div>`;}
function offerBox(term,final=false){const t=terms[term];return `<div class="cj-box"><span class="cj-badge ${final?'accent':''}">${final?'После рассмотрения в демо':'Предварительный расчёт'}</span><h4 style="margin-top:12px">Разовый кредит на закупку товара</h4><div class="cj-compare"><div><span class="cj-small cj-muted">Сумма · срок</span><div class="cj-value">1 000 000 ₽</div><span class="cj-muted">${duration(term)}</span></div><div><span class="cj-small cj-muted">Ежемесячный платёж</span><div class="cj-value">${t.payment} ₽</div><span class="cj-small cj-muted">Последний платёж может отличаться на копейки</span></div></div><dl><div><dt>Ставка в демо</dt><dd>24% годовых</dd></div><div><dt>Всего к возврату</dt><dd>${t.total} ₽</dd></div><div><dt>Из них проценты</dt><dd>${t.interest} ₽</dd></div><div><dt>Комиссии</dt><dd>0 ₽</dd></div></dl></div>`;}
function offers(){return `<h3>Предложения под вашу задачу</h3><p class="cj-muted cj-small">Для примера ООО «Север». До рассмотрения это не одобрение.</p><div class="cj-highlight">На 12 месяцев платёж — 94 559,60 ₽, доступно — 70 000 ₽. Сохранили сумму и увеличили срок до ${duration(state.selectedTerm)}.</div>${offerBox(state.selectedTerm)}<div class="cj-actions">${btn('Выбрать и проверить заявку','choose',true)}${btn(state.scenario?'Закрыть сценарий':'А если на '+duration(state.selectedTerm===18?24:18)+'?','scenario')}</div>${state.scenario?`<div class="cj-box cj-scenario"><span class="cj-badge accent">Отдельный сценарий · не применён</span><h4 style="margin-top:10px">Тот же миллион на ${duration(state.selectedTerm===18?24:18)}</h4><dl><div><dt>Платёж</dt><dd>${terms[state.selectedTerm===18?24:18].payment} ₽ / мес.</dd></div><div><dt>Всего к возврату</dt><dd>${terms[state.selectedTerm===18?24:18].total} ₽</dd></div></dl><div class="cj-note">${state.selectedTerm===18?'Платёж ниже, общие выплаты выше на 68 268,43 ₽.':'Платёж выше, общие выплаты ниже на 68 268,43 ₽.'}</div><div class="cj-actions">${btn('Применить сценарий к черновику','apply-scenario')}</div></div>`:''}<div class="cj-note">Сумму не уменьшаем без подтверждения, что её хватит на закупку.</div>`;}
function review(){return `<h3>Проверьте заявку</h3><p class="cj-muted cj-small">ООО «Север» · закупка товара · подтверждённые данные примера</p>${offerBox(state.selectedTerm)}<label class="cj-check"><input type="checkbox" data-toggle="consent" ${state.consent?'checked':''}><span>Подтверждаю отправку показанных данных на рассмотрение в демонстрации</span></label><div class="cj-actions">${btn('Отправить заявку в демо','submit',true,!state.consent)}${btn('Вернуться к предложениям','back-offers')}</div><div class="cj-note">Реальная заявка в банк не отправляется.</div>`;}
function status(){const phase=state.status;const ready=phase==='offers_ready'||phase==='ready_to_sign';return `<span class="cj-badge accent">Заявка DEMO-001 · версия 1</span><h3 style="margin-top:13px">${({submitted:'Заявка отправлена',under_review:'Заявка на рассмотрении',offers_ready:'Получено предложение',ready_to_sign:'Можно перейти к подписанию'})[phase]}</h3><p class="cj-muted cj-small">${ready?'Результат демонстрационного рассмотрения.':'Выбранные параметры сохранены. Отправленная версия не редактируется.'}</p><ol class="cj-list"><li>Данные и выбранный вариант подтверждены</li><li>${phase==='submitted'?'Ожидается начало проверок':'Регистрация и обязательства '+(ready?'проверены':'проверяются')}</li><li>${ready?'Расчёт и проверка требований завершены':'Ожидается результат расчёта и проверки требований'}</li><li>${phase==='ready_to_sign'?'Предложение выбрано клиентом':'Предложение ещё не принято для подписания'}</li></ol>${ready?offerBox(state.selectedTerm,true):`<div class="cj-box"><div class="cj-small cj-muted">Выбранный предварительный вариант</div><h4 style="margin-top:6px">1 000 000 ₽ · ${duration(state.selectedTerm)}</h4><div>${terms[state.selectedTerm].payment} ₽ / мес.</div></div>`}<div class="cj-actions">${phase==='submitted'?btn('Показать этап проверок','start-review',true):phase==='under_review'?btn('Показать результат демо','result',true):phase==='offers_ready'?btn('Выбрать итоговое предложение','select-final',true):btn('Новая потребность','new')}</div><div class="cj-note">${phase==='ready_to_sign'?'Подписание и выдача в этом референсе не выполняются.':'Переходы запускаются вручную для просмотра макета. В сервисе статус меняется по результату обработки.'}</div>`;}
function chat(){if(state.stage==='need'){const product=state.mode==='product',ex=example();return `<div><div class="cj-speaker">Помощник</div><p>${product?'Уже знаете продукт? Выберите его слева — помогу разобраться с параметрами и требованиями.':'Опишите задачу своими словами — помогу уточнить сумму, сроки и характер потребности.'}</p></div><div><div class="cj-speaker">Пример сообщения клиента</div><div class="cj-bubble">${ex.message}</div></div>${state.pending?`<div class="cj-box"><span class="cj-badge accent">Предложено · не применено</span><dl>${ex.rows.map(([key,value])=>`<div><dt>${key}</dt><dd>${value}</dd></div>`).join('')}</dl><div class="cj-note">Источник: пример сообщения в диалоге. Применение заменит эти значения в черновике.</div><div class="cj-actions">${btn('Применить к форме','apply',true)}${btn('Отменить','dismiss')}</div></div>`:`${state.applied?'<p>Значения применены. Неизвестные сведения остались незаполненными.</p>':''}${btn('Показать предложение помощника','suggest')}`}<div class="cj-note">Все действия доступны и через форму.</div>`;}
if(state.stage==='business')return `<p>Потребность сохранена. В реальном кабинете здесь можно заполнить данные компании или подтвердить сведения из профиля.</p><p class="cj-small cj-muted">Для просмотра следующих экранов откройте вымышленный пример ООО «Север».</p>${btn('Открыть пример финансов','demo',true)}`;
if(state.stage==='finance')return `<p>Показываю сведения из примера выписки. Проверьте источник и значения слева — они попадут в расчёт после подтверждения.</p><div class="cj-box"><div class="cj-small cj-muted">Выписка · 6 месяцев</div><h4 style="margin-top:7px">${state.confirmed?'Сведения подтверждены':'Сведения требуют подтверждения'}</h4><div class="cj-note">Здесь также доступна загрузка документов в будущем кабинете.</div></div>${btn('Подтвердить сведения примера','confirm-finance',false,state.confirmed)}`;
if(state.stage==='offers')return `<p>На исходном сроке платёж превышает доступный. Вариант на ${duration(state.selectedTerm)} сохраняет нужную сумму и укладывается в нагрузку.</p><div class="cj-box"><span class="cj-badge">Предварительно</span><h4 style="margin-top:8px">1 000 000 ₽ на ${duration(state.selectedTerm)}</h4><p>${terms[state.selectedTerm].payment} ₽ / мес.</p><div class="cj-actions">${btn('Выбрать этот вариант','choose',true)}</div></div><div class="cj-note">Заявка ещё не отправлена. Сценарий «а если» показывается отдельно.</div>`;
if(state.stage==='review')return '<p>Проверьте компанию, сумму, срок и общие выплаты. Отправка начнёт демонстрационное рассмотрение. Предварительный расчёт ещё не гарантирует итоговое предложение.</p>';
return `<p>${state.status==='submitted'?'Заявка сохранена как отправленная версия. Следующее действие — дождаться проверок.':state.status==='under_review'?'Идёт этап проверок. Техническая ошибка или ожидание ответа не должны выглядеть как отказ.':state.status==='offers_ready'?'В демонстрации проверки завершились успешно. Теперь можно выбрать итоговое предложение.':'Итоговое предложение выбрано. Следующим действием в сервисе будет подписание.'}</p><div class="cj-note">Помощник объясняет статус; решение поступает из модуля рассмотрения.</div>`;
}
function next(){return ({need:[state.mode==='task'?'Сначала опишите потребность':'Сначала выберите продукт','Общие сведения о компании и документы соберём на следующих этапах.'],business:['Подтвердите сведения о бизнесе','Для следующих экранов доступен готовый демонстрационный пример.'],finance:['Проверьте источник и подтвердите данные','Подтверждение доступно в форме и рядом с сообщением помощника.'],offers:['Выберите предварительный вариант','Предложение до рассмотрения не является одобрением.'],review:['Проверьте и подтвердите отправку','После отправки эта версия заявки останется неизменной.'],status:[({submitted:'Ожидайте начала рассмотрения',under_review:'Ожидайте результат проверок',offers_ready:'Выберите итоговое предложение',ready_to_sign:'Следующее действие — подписание'})[state.status],'Демонстрация процесса без отправки данных в банк.']})[state.stage];}
function sync(){app.querySelector('[data-action="continue"]')?.toggleAttribute('disabled',!complete());app.querySelector('[data-action="offers"]')?.toggleAttribute('disabled',!state.confirmed||state.amount!=='1000000'||state.term!=='12');app.querySelector('[data-action="submit"]')?.toggleAttribute('disabled',!state.consent);}
function render(){const index=['need','business','finance','offers','review','status'].indexOf(state.stage),n=next();app.innerHTML=`<header class="cj-bar"><div class="cj-brand"><span class="cj-logo">Д</span>Дело за малым<span class="cj-badge">Референс для дизайнера</span></div><span class="cj-small cj-muted">${state.demo?'ООО «Север»':'Новая потребность'} · ${state.stage==='status'?'Демо-заявка':'Черновик'}</span></header><div class="cj-head"><h2>Финансирование для вашего бизнеса</h2><div class="cj-small cj-muted">Форма и помощник · выразительный банковский интерфейс</div></div><nav class="cj-steps" aria-label="Путь заявки">${['Потребность','Бизнес','Финансы','Предложения','Отправка','Статус'].map((label,i)=>`<span class="cj-step ${index===i?'active':''}" ${index===i?'aria-current="step"':''}>${i+1}. ${label}</span>`).join('')}</nav><div class="cj-next" role="status" aria-live="polite"><strong>${n[0]}</strong><div class="cj-small cj-muted">${n[1]}</div></div><div class="cj-grid"><main class="cj-main ${state.applied?'cj-applied':''}">${({need,business,finance,offers,review,status})[state.stage]()}</main><aside class="cj-chat"><div class="cj-chat-head"><span>Помощник</span><span class="cj-badge">Пример диалога</span></div><div class="cj-chat-body" aria-live="polite">${chat()}</div></aside></div>`;sync();}
function changeField(input){const key=input.dataset.field;if(!(key in state))return;state[key]=input.value;if(state.stage==='need'&&state.pending){state.pending=null;const body=app.querySelector('.cj-chat-body');if(body)body.innerHTML=chat();app.querySelector('.cj-highlight')?.remove();}if(state.stage==='finance'&&['amount','term'].includes(key)){state.confirmed=false;const check=app.querySelector('[data-toggle="confirmed"]');if(check)check.checked=false;}sync();save();}
app.addEventListener('input',event=>{if(event.target.matches('input[data-field]'))changeField(event.target);});
app.addEventListener('change',event=>{const input=event.target;if(input.matches('select[data-field]'))changeField(input);if(input.dataset.toggle){const key=input.dataset.toggle;if(!['unknown','confirmed','consent'].includes(key))return;state[key]=input.checked;if(key==='unknown'){state.pending=null;if(state.unknown)state.amount='';render();}else sync();save();}});
app.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;
if(b.dataset.mode){state.mode=b.dataset.mode;state.pending=null;state.applied=false;render();save();return;}
if(b.dataset.task){state.task=b.dataset.task;state.pending=null;state.applied=false;render();save();return;}
if(b.dataset.product){state.product=b.dataset.product;state.pending=null;state.applied=false;render();save();return;}
const action=b.dataset.action;if(!action)return;state.applied=false;
if(action==='suggest')state.pending={mode:state.mode};
if(action==='dismiss')state.pending=null;
if(action==='apply'&&state.pending){Object.assign(state,example().values);state.unknown=false;state.pending=null;state.applied=true;}
if(action==='continue'&&complete())state.stage='business';
if(action==='back-need')state.stage='need';
if(action==='back-business')state.stage='business';
if(action==='demo'){Object.assign(state,{demo:true,stage:'finance',mode:'product',product:'working_capital_loan',task:'stock',purpose:'working_capital',amount:'1000000',term:'12',unknown:false,confirmed:false,selectedTerm:18,consent:false,status:'draft',pending:null,scenario:false,finalSelected:false});}
if(action==='confirm-finance')state.confirmed=true;
if(action==='offers'&&state.confirmed&&state.amount==='1000000'&&state.term==='12')state.stage='offers';
if(action==='scenario')state.scenario=!state.scenario;
if(action==='apply-scenario'&&state.scenario){state.selectedTerm=state.selectedTerm===18?24:18;state.scenario=false;state.applied=true;}
if(action==='choose'){state.stage='review';state.consent=false;state.scenario=false;}
if(action==='back-offers')state.stage='offers';
if(action==='submit'&&state.consent){state.stage='status';state.status='submitted';}
if(action==='start-review'&&state.status==='submitted')state.status='under_review';
if(action==='result'&&state.status==='under_review')state.status='offers_ready';
if(action==='select-final'&&state.status==='offers_ready'){state.status='ready_to_sign';state.finalSelected=true;}
if(action==='new'){Object.assign(state,{stage:'need',mode:'task',task:'',product:'',amount:'',unknown:false,neededBy:'',recurring:'',term:'',purpose:'',repayDate:'',period:'',ownFunds:'',currentPayment:'',pending:null,applied:false,demo:false,confirmed:false,selectedTerm:18,scenario:false,consent:false,status:'draft',finalSelected:false});}
render();save();if(state.applied)setTimeout(()=>{state.applied=false;app.querySelector('.cj-applied')?.classList.remove('cj-applied');},300);
});
restore(window.openai?.widgetState);render();
window.addEventListener('openai:set_globals',event=>{const value=event.detail?.globals?.widgetState;if(value?.privateContent?.journey&&JSON.stringify(value.privateContent.journey)!==lastSnapshot){restore(value);render();}});
})();
</script>
</div>
