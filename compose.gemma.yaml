# Local mode only. Use with compose.yaml or compose.demo.yaml; never needed on the VPS.
services:
  api:
    environment:
      CHAT_MODE: model
      LLM_API_BASE_URL: http://gemma:11434/v1
      LLM_MODEL: alfa-gemma-q4
      LLM_API_KEY: ""
      TAVILY_API_KEY: ""
      LLM_REASONING_EFFORT: ""
      LLM_RESPONSE_FORMAT: json_object
      LLM_CONTEXT_SIZE: "16384"
      LLM_MAX_OUTPUT_TOKENS: "4096"
      HTTP_TIMEOUT_SECONDS: "300"
      CHAT_MAX_CONCURRENT_GENERATIONS: "1"
    depends_on:
      gemma-init:
        condition: service_completed_successfully
  gemma:
    image: ollama/ollama:0.33.1
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - gemma_models:/root/.ollama
      - ./scr/delo_za_malyn/Models/Llm/weights:/models:ro
    ports:
      - "127.0.0.1:${GEMMA_PORT:-11437}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
  gemma-init:
    image: ollama/ollama:0.33.1
    environment:
      OLLAMA_HOST: http://gemma:11434
    volumes:
      - ./scr/delo_za_malyn/Models/Llm/weights:/models:ro
      - ./deploy/gemma.Modelfile:/config/Modelfile:ro
    depends_on:
      gemma:
        condition: service_healthy
    entrypoint: ["ollama"]
    command: ["create", "alfa-gemma-q4", "-f", "/config/Modelfile"]
    restart: "no"
volumes:
  gemma_models:
