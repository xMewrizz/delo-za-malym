function offers(){return `&lt;h3&gt;Предложения под вашу задачу&lt;/h3&gt;&lt;p class=&quot;cj-muted cj-small&quot;&gt;Для примера ООО «Север». До рассмотрения это не одобрение.&lt;/p&gt;&lt;div class=&quot;cj-highlight&quot;&gt;На 12 месяцев платёж — 94 559,60 ₽, доступно — 70 000 ₽. Сохранили сумму и увеличили срок до ${duration(state.selectedTerm)}.&lt;/div&gt;${offerBox(state.selectedTerm)}&lt;div class=&quot;cj-actions&quot;&gt;${btn(&#x27;Выбрать и проверить заявку&#x27;,&#x27;choose&#x27;,true)}${btn(state.scenario?&#x27;Закрыть сценарий&#x27;:&#x27;А если на &#x27;+duration(state.selectedTerm===18?24:18)+&#x27;?&#x27;,&#x27;scenario&#x27;)}&lt;/div&gt;${state.scenario?`&lt;div class=&quot;cj-box cj-scenario&quot;&gt;&lt;span class=&quot;cj-badge accent&quot;&gt;Отдельный сценарий · не применён&lt;/span&gt;&lt;h4 style=&quot;margin-top:10px&quot;&gt;Тот же миллион на ${duration(state.selectedTerm===18?24:18)}&lt;/h4&gt;&lt;dl&gt;&lt;div&gt;&lt;dt&gt;Платёж&lt;/dt&gt;&lt;dd&gt;${terms[state.selectedTerm===18?24:18].payment} ₽ / мес.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Всего к возврату&lt;/dt&gt;&lt;dd&gt;${terms[state.selectedTerm===18?24:18].total} ₽&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;cj-note&quot;&gt;${state.selectedTerm===18?&#x27;Платёж ниже, общие выплаты выше на 68 268,43 ₽.&#x27;:&#x27;Платёж выше, общие выплаты ниже на 68 268,43 ₽.&#x27;}&lt;/div&gt;&lt;div class=&quot;cj-actions&quot;&gt;${btn(&#x27;Применить сценарий к черновику&#x27;,&#x27;apply-scenario&#x27;)}&lt;/div&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;cj-note&quot;&gt;Сумму не уменьшаем без подтверждения, что её хватит на закупку.&lt;/div&gt;`;}
function review(){return `&lt;h3&gt;Проверьте заявку&lt;/h3&gt;&lt;p class=&quot;cj-muted cj-small&quot;&gt;ООО «Север» · закупка товара · подтверждённые данные примера&lt;/p&gt;${offerBox(state.selectedTerm)}&lt;label class=&quot;cj-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-toggle=&quot;consent&quot; ${state.consent?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;Подтверждаю отправку показанных данных на рассмотрение в демонстрации&lt;/span&gt;&lt;/label&gt;&lt;div class=&quot;cj-actions&quot;&gt;${btn(&#x27;Отправить заявку в демо&#x27;,&#x27;submit&#x27;,true,!state.consent)}${btn(&#x27;Вернуться к предложениям&#x27;,&#x27;back-offers&#x27;)}&lt;/div&gt;&lt;div class=&quot;cj-note&quot;&gt;Реальная заявка в банк не отправляется.&lt;/div&gt;`;}
function status(){const phase=state.status;const ready=phase===&#x27;offers_ready&#x27;||phase===&#x27;ready_to_sign&#x27;;return `&lt;span class=&quot;cj-badge accent&quot;&gt;Заявка DEMO-001 · версия 1&lt;/span&gt;&lt;h3 style=&quot;margin-top:13px&quot;&gt;${({submitted:&#x27;Заявка отправлена&#x27;,under_review:&#x27;Заявка на рассмотрении&#x27;,offers_ready:&#x27;Получено предложение&#x27;,ready_to_sign:&#x27;Можно перейти к подписанию&#x27;})[phase]}&lt;/h3&gt;&lt;p class=&quot;cj-muted cj-small&quot;&gt;${ready?&#x27;Результат демонстрационного рассмотрения.&#x27;:&#x27;Выбранные параметры сохранены. Отправленная версия не редактируется.&#x27;}&lt;/p&gt;&lt;ol class=&quot;cj-list&quot;&gt;&lt;li&gt;Данные и выбранный вариант подтверждены&lt;/li&gt;&lt;li&gt;${phase===&#x27;submitted&#x27;?&#x27;Ожидается начало проверок&#x27;:&#x27;Регистрация и обязательства &#x27;+(ready?&#x27;проверены&#x27;:&#x27;проверяются&#x27;)}&lt;/li&gt;&lt;li&gt;${ready?&#x27;Расчёт и проверка требований завершены&#x27;:&#x27;Ожидается результат расчёта и проверки требований&#x27;}&lt;/li&gt;&lt;li&gt;${phase===&#x27;ready_to_sign&#x27;?&#x27;Предложение выбрано клиентом&#x27;:&#x27;Предложение ещё не принято для подписания&#x27;}&lt;/li&gt;&lt;/ol&gt;${ready?offerBox(state.selectedTerm,true):`&lt;div class=&quot;cj-box&quot;&gt;&lt;div class=&quot;cj-small cj-muted&quot;&gt;Выбранный предварительный вариант&lt;/div&gt;&lt;h4 style=&quot;margin-top:6px&quot;&gt;1 000 000 ₽ · ${duration(state.selectedTerm)}&lt;/h4&gt;&lt;div&gt;${terms[state.selectedTerm].payment} ₽ / мес.&lt;/div&gt;&lt;/div&gt;`}&lt;div class=&quot;cj-actions&quot;&gt;${phase===&#x27;submitted&#x27;?btn(&#x27;Показать этап проверок&#x27;,&#x27;start-review&#x27;,true):phase===&#x27;under_review&#x27;?btn(&#x27;Показать результат демо&#x27;,&#x27;result&#x27;,true):phase===&#x27;offers_ready&#x27;?btn(&#x27;Выбрать итоговое предложение&#x27;,&#x27;select-final&#x27;,true):btn(&#x27;Новая потребность&#x27;,&#x27;new function chat(){if(state.stage===&#x27;need&#x27;){const product=state.mode===&#x27;product&#x27;,ex=example();return `&lt;div&gt;&lt;div class=&quot;cj-speaker&quot;&gt;Помощник&lt;/div&gt;&lt;p&gt;${product?&#x27;Уже знаете продукт? Выберите его слева — помогу разобраться с параметрами и требованиями.&#x27;:&#x27;Опишите задачу своими словами — помогу уточнить сумму, сроки и характер потребности.&#x27;}&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;cj-speaker&quot;&gt;Пример сообщения клиента&lt;/div&gt;&lt;div class=&quot;cj-bubble&quot;&gt;${ex.message}&lt;/div&gt;&lt;/div&gt;${state.pending?`&lt;div class=&quot;cj-box&quot;&gt;&lt;span class=&quot;cj-badge accent&quot;&gt;Предложено · не применено&lt;/span&gt;&lt;dl&gt;${ex.rows.map(([key,value])=&gt;`&lt;div&gt;&lt;dt&gt;${key}&lt;/dt&gt;&lt;dd&gt;${value}&lt;/dd&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/dl&gt;&lt;div class=&quot;cj-note&quot;&gt;Источник: пример сообщения в диалоге. Применение заменит эти значения в черновике.&lt;/div&gt;&lt;div class=&quot;cj-actions&quot;&gt;${btn(&#x27;Применить к форме&#x27;,&#x27;apply&#x27;,true)}${btn(&#x27;Отменить&#x27;,&#x27;dismiss&#x27;)}&lt;/div&gt;&lt;/div&gt;`:`${state.applied?&#x27;&lt;p&gt;Значения применены. Неизвестные сведения остались незаполненными.&lt;/p&gt;&#x27;:&#x27;&#x27;}${btn(&#x27;Показать предложение помощника&#x27;,&#x27;suggest&#x27;)}`}&lt;div class=&quot;cj-note&quot;&gt;Все действия доступны и через форму.&lt;/div&gt;`;}
if(state.stage===&#x27;business&#x27;)return `&lt;p&gt;Потребность сохранена. В реальном кабинете здесь можно заполнить данные компании или подтвердить сведения из профиля.&lt;/p&gt;&lt;p class=&quot;cj-small cj-muted&quot;&gt;Для просмотра следующих экранов откройте вымышленный пример ООО «Север».&lt;/p&gt;${btn(&#x27;Открыть пример финансов&#x27;,&#x27;demo&#x27;,true)}`;
if(state.stage===&#x27;finance&#x27;)return `&lt;p&gt;Показываю сведения из примера выписки. Проверьте источник и значения слева — они попадут в расчёт после подтверждения.&lt;/p&gt;&lt;div class=&quot;cj-box&quot;&gt;&lt;div class=&quot;cj-small cj-muted&quot;&gt;Выписка · 6 месяцев&lt;/div&gt;&lt;h4 style=&quot;margin-top:7px&quot;&gt;${state.confirmed?&#x27;Сведения подтверждены&#x27;:&#x27;Сведения требуют подтверждения&#x27;}&lt;/h4&gt;&lt;div class=&quot;cj-note&quot;&gt;Здесь также доступна загрузка документов в будущем кабинете.&lt;/div&gt;&lt;/div&gt;${btn(&#x27;Подтвердить сведения примера&#x27;,&#x27;confirm-finance&#x27;,false,state.confirmed)}`;
if(state.stage===&#x27;offers&#x27;)return `&lt;p&gt;На исходном сроке платёж превышает доступный. Вариант на ${duration(state.selectedTerm)} сохраняет нужную сумму и укладывается в нагрузку.&lt;/p&gt;&lt;div class=&quot;cj-box&quot;&gt;&lt;span class=&quot;cj-badge&quot;&gt;Предварительно&lt;/span&gt;&lt;h4 style=&quot;margin-top:8px&quot;&gt;1 000 000 ₽ на ${duration(state.selectedTerm)}&lt;/h4&gt;&lt;p&gt;${terms[state.selectedTerm].payment} ₽ / мес.&lt;/p&gt;&lt;div class=&quot;cj-actions&quot;&gt;${btn(&#x27;Выбрать этот вариант&#x27;,&#x27;choose&#x27;,true)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cj-note&quot;&gt;Заявка ещё не отправлена. Сценарий «а если» показывается отдельно.&lt;/div&gt;`;
if(state.stage===&#x27;review&#x27;)return &#x27;&lt;p&gt;Проверьте компанию, сумму, срок и общие выплаты. Отправка начнёт демонстрационное рассмотрение. Предварительный расчёт ещё не гарантирует итоговое предложение.&lt;/p&gt;&#x27;;
return `&lt;p&gt;${state.status===&#x27;submitted&#x27;?&#x27;Заявка сохранена как отправленная версия. Следующее действие — дождаться проверок.&#x27;:state.status===&#x27;under_review&#x27;?&#x27;Идёт этап проверок. Техническая ошибка или ожидание ответа не должны выглядеть как отказ.&#x27;:state.status===&#x27;offers_ready&#x27;?&#x27;В демонстрации проверки завершились успешно. Теперь можно выбрать итоговое предложение.&#x27;:&#x27;Итоговое предложение выбрано. Следующим действием в сервисе будет подписание.&#x27;}&lt;/p&gt;&lt;div class=&quot;cj-note&quot;&gt;Помощник объясняет статус; решение поступает из модуля рассмотрения.&lt;/div&gt;`;
}
function next(){return ({need:[state.mode===&#x27;task&#x27;?&#x27;Сначала опишите потребность&#x27;:&#x27;Сначала выберите продукт&#x27;,&#x27;Общие сведения о компании и документы соберём на следующих этапах.&#x27;],business:[&#x27;Подтвердите сведения о бизнесе&#x27;,&#x27;Для следующих экранов доступен готовый демонстрационный пример.&#x27;],finance:[&#x27;Проверьте источник и подтвердите данные&#x27;,&#x27;Подтверждение доступно в форме и рядом с сообщением помощника.&#x27;],offers:[&#x27;Выберите предварительный вариант&#x27;,&#x27;Предложение до рассмотрения не является одобрением.&#x27;],review:[&#x27;Проверьте и подтвердите отправку&#x27;,&#x27;После отправки эта версия заявки останется неизменной.&#x27;],status:[({submitted:&#x27;Ожидайте начала рассмотрения&#x27;,under_review:&#x27;Ожидайте результат проверок&#x27;,offers_ready:&#x27;Выберите итоговое предложение&#x27;,ready_to_sign:&#x27;Следующее действие — подписание&#x27;})[state.status],&#x27;Демонстрация процесса без отправки данных в банк.&#x27;]})[state.stage];}
function sync(){app.querySelector(&#x27;[data-action=&quot;continue&quot;]&#x27;)?.toggleAttribute(&#x27;disabled&#x27;,!complete());app.querySelector(&#x27;[data-action=&quot;offers&quot;]&#x27;)?.toggleAttribute(&#x27;disabled&#x27;,!state.confirmed||state.amount!==&#x27;1000000&#x27;||state.term!==&#x27;12&#x27;);app.querySelector(&#x27;[data-action=&quot;submit&quot;]&#x27;)?.toggleAttribute(&#x27;disabled&#x27;,!state.consent);}
function render(){const index=[&#x27;need&#x27;,&#x27;business&#x27;,&#x27;finance&#x27;,&#x27;offers&#x27;,&#x27;review&#x27;,&#x27;status&#x27;].indexOf(state.stage),n=next();app.innerHTML=`&lt;header class=&quot;cj-bar&quot;&gt;&lt;div class=&quot;cj-brand&quot;&gt;&lt;span class=&quot;cj-logo&quot;&gt;Д&lt;/span&gt;Дело за малым&lt;span class=&quot;cj-badge&quot;&gt;Референс для дизайнера&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;cj-small cj-muted&quot;&gt;${state.demo?&#x27;ООО «Север»&#x27;:&#x27;Новая потребность&#x27;} · ${state.stage===&#x27;status&#x27;?&#x27;Демо-заявка&#x27;:&#x27;Черновик&#x27;}&lt;/span&gt;&lt;/header&gt;&lt;div class=&quot;cj-head&quot;&gt;&lt;h2&gt;Финансирование для вашего бизнеса&lt;/h2&gt;&lt;div class=&quot;cj-small cj-muted&quot;&gt;Форма и помощник · выразительный банковский интерфейс&lt;/div&gt;&lt;/div&gt;&lt;nav class=&quot;cj-steps&quot; aria-label=&quot;Путь заявки&quot;&gt;${[&#x27;Потребность&#x27;,&#x27;Бизнес&#x27;,&#x27;Финансы&#x27;,&#x27;Предложения&#x27;,&#x27;Отправка&#x27;,&#x27;Статус&#x27;].map((label,i)=&gt;`&lt;span class=&quot;cj-step ${index===i?&#x27;active&#x27;:&#x27;&#x27;}&quot; ${index===i?&#x27;aria-current=&quot;step&quot;&#x27;:&#x27;&#x27;}&gt;${i+1}. ${label}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;&lt;div class=&quot;cj-next&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;strong&gt;${n[0]}&lt;/strong&gt;&lt;div class=&quot;cj-small cj-muted&quot;&gt;${n[1]}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cj-grid&quot;&gt;&lt;main class=&quot;cj-main ${state.applied?&#x27;cj-applied&#x27;:&#x27;&#x27;}&quot;&gt;${({need,business,finance,offers,review,status})[state.stage]()}&lt;/main&gt;&lt;aside class=&quot;cj-chat&quot;&gt;&lt;div class=&quot;cj-chat-head&quot;&gt;&lt;span&gt;Помощник&lt;/span&gt;&lt;span class=&quot;cj-badge&quot;&gt;Пример диалога&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cj-chat-body&quot; aria-live=&quot;polite&quot;&gt;${chat()}&lt;/div&gt;&lt;/aside&gt;&lt;/div&gt;`;sync();}
function changeField(input){const key=input.dataset.field;if(!(key in state))return;state[key]=input.value;if(state.stage===&#x27;need&#x27;&amp;&amp;state.pending){state.pending=null;const body=app.querySelector(&#x27;.cj-chat-body&#x27;);if(body)body.innerHTML=chat();app.querySelector(&#x27;.cj-highlight&#x27;)?.remove();}if(state.stage===&#x27;finance&#x27;&amp;&amp;[&#x27;amount&#x27;,&#x27;term&#x27;].includes(key)){state.confirmed=false;const check=app.querySelector(&#x27;[data-toggle=&quot;confirmed&quot;]&#x27;);if(check)check.checked=false;}sync();save();}
app.addEventListener(&#x27;input&#x27;,event=&gt;{if(event.target.matches(&#x27;input[data-field]&#x27;))changeField(event.target);});
app.addEventListener(&#x27;change&#x27;,event=&gt;{const input=event.target;if(input.matches(&#x27;select[data-field]&#x27;))changeField(input);if(input.dataset.toggle){const key=input.dataset.toggle;if(![&#x27;unknown&#x27;,&#x27;confirmed&#x27;,&#x27;consent&#x27;].includes(key))return;state[key]=input.checked;if(key===&#x27;unknown&#x27;){state.pending=null;if(state.unknown)state.amount=&#x27;&#x27;;render();}else sync();save();}});
app.addEventListener(&#x27;click&#x27;,event=&gt;{const b=event.target.closest(&#x27;button&#x27;);if(!b||b.disabled)return;
if(b.dataset.mode){state.mode=b.dataset.mode;state.pending=null;state.applied=false;render();save();return;}
if(b.dataset.task){state.task=b.dataset.task;state.pending=null;state.applied=false;render();save();return;}
if(b.dataset.product){state.product=b.dataset.product;state.pending=null;state.applied=false;render();save();return;}
const action=b.dataset.action;if(!action)return;state.applied=false;
if(action===&#x27;suggest&#x27;)state.pending={mode:state.mode};
if(action===&#x27;dismiss&#x27;)state.pending=null;

    "visualization-share-root",

  let sizeFingerprint = null;
  let sizeWriteTimeout;

  let pendingSize = null;

    globalThis.location.pathname,

  const sizeStorageKey = `${storageKey}:share-size-v1`;

      new TextEncoder().encode(serializedState).length > 16 * 1024

      state == null ||
      typeof state !== "object" ||

        typeof prompt !== "string" ||

  const srcdoc = frame.dataset.srcdoc;

  globalThis.addEventListener("resize", () => {

    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {

    channel.port1.postMessage({ type: "measure" });

  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );

  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );

    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }

      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");

        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&

        typeof size.height === "number" &&

    }

  delete frame.dataset.srcdoc;
