<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title"><title id="title">Четыре таблицы SQLite и логические связи</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#b39cd5" fill="none"/></marker></defs><rect width="900" height="390" rx="16" fill="#1b1e22"/><g font-family="Arial, sans-serif"><rect x="25" y="30" width="365" height="135" rx="12" fill="#25282e" stroke="#8b6ab8"/><text x="41" y="59" fill="#c29dff" font-size="15" font-weight="600">applications · application_id</text><text x="41" y="83" fill="#bfc3cc" font-size="12">Версия, состояние, сведения и проверки</text><text x="41" y="103" fill="#bfc3cc" font-size="12">Снимки отправки, условия и события</text><text x="41" y="123" fill="#bfc3cc" font-size="12">Договор, продукт и его операции</text><rect x="510" y="30" width="365" height="100" rx="12" fill="#25282e" stroke="#50555f"/><text x="526" y="59" fill="#f2f3f5" font-size="15" font-weight="600">chats · chat_id</text><text x="526" y="83" fill="#bfc3cc" font-size="12">application_id — связь с заявкой</text><text x="526" y="103" fill="#bfc3cc" font-size="12">Сообщения и неподтверждённые изменения</text><rect x="510" y="175" width="365" height="100" rx="12" fill="#25282e" stroke="#50555f"/><text x="526" y="204" fill="#f2f3f5" font-size="15" font-weight="600">documents · document_id</text><text x="526" y="228" fill="#bfc3cc" font-size="12">application_id — связь с заявкой</text><text x="526" y="248" fill="#bfc3cc" font-size="12">PDF BLOB и источник извлечённых данных</text><rect x="25" y="215" width="365" height="100" rx="12" fill="#25282e" stroke="#50555f"/><text x="41" y="244" fill="#f2f3f5" font-size="15" font-weight="600">account_payments · request_id</text><text x="41" y="268" fill="#bfc3cc" font-size="12">Получатель и подтверждённая сумма</text><text x="41" y="288" fill="#bfc3cc" font-size="12">Версия счёта и распределение источников</text><path d="M510,80 L390,80" stroke="#b39cd5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M510,225 L390,135" stroke="#b39cd5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="25" y="361" fill="#bfc3cc" font-size="12">Связи логические. В MVP один демо-клиент; авторизации и tenant-изоляции нет.</text></g></svg>