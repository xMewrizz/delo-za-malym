<svg xmlns="http://www.w3.org/2000/svg" width="900" height="375" viewBox="0 0 900 375" role="img" aria-labelledby="title"><title id="title">Архитектура: клиентский путь, серверный процесс, движок, модель и синтетические источники</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#b39cd5" fill="none"/></marker></defs><rect width="900" height="375" rx="16" fill="#1b1e22"/><g font-family="Arial, sans-serif"><rect x="25" y="30" width="220" height="95" rx="12" fill="#25282e" stroke="#50555f"/><text x="41" y="59" fill="#f2f3f5" font-size="15" font-weight="600">Предприниматель</text><text x="41" y="83" fill="#bfc3cc" font-size="12">Форма и Лума</text><text x="41" y="103" fill="#bfc3cc" font-size="12">Проверка и подтверждения</text><rect x="335" y="30" width="230" height="95" rx="12" fill="#25282e" stroke="#8b6ab8"/><text x="351" y="59" fill="#c29dff" font-size="15" font-weight="600">Серверный процесс</text><text x="351" y="83" fill="#bfc3cc" font-size="12">Версии и состояния</text><text x="351" y="103" fill="#bfc3cc" font-size="12">Проверки и выбор условий</text><rect x="655" y="30" width="220" height="95" rx="12" fill="#25282e" stroke="#50555f"/><text x="671" y="59" fill="#f2f3f5" font-size="15" font-weight="600">Финансовый движок</text><text x="671" y="83" fill="#bfc3cc" font-size="12">Денежный поток и риск</text><text x="671" y="103" fill="#bfc3cc" font-size="12">Пять продуктовых политик</text><path d="M245,78 L335,78" stroke="#b39cd5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M565,78 L655,78" stroke="#b39cd5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="25" y="210" width="220" height="95" rx="12" fill="#25282e" stroke="#50555f"/><text x="41" y="239" fill="#f2f3f5" font-size="15" font-weight="600">Открытая LLM</text><text x="41" y="263" fill="#bfc3cc" font-size="12">Опциональный API</text><text x="41" y="283" fill="#bfc3cc" font-size="12">Извлечение и объяснение</text><rect x="335" y="210" width="230" height="95" rx="12" fill="#25282e" stroke="#50555f"/><text x="351" y="239" fill="#f2f3f5" font-size="15" font-weight="600">SQLite</text><text x="351" y="263" fill="#bfc3cc" font-size="12">Заявки, чаты и PDF</text><text x="351" y="283" fill="#bfc3cc" font-size="12">Операции и история</text><rect x="655" y="210" width="220" height="95" rx="12" fill="#25282e" stroke="#50555f"/><text x="671" y="239" fill="#f2f3f5" font-size="15" font-weight="600">Симуляторы источников</text><text x="671" y="263" fill="#bfc3cc" font-size="12">Регистрация и БКИ</text><text x="671" y="283" fill="#bfc3cc" font-size="12">Ограничения и долги</text><path d="M390,125 L390,165 L135,165 L135,210" stroke="#b39cd5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M450,125 L450,210" stroke="#b39cd5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M510,125 L510,165 L765,165 L765,210" stroke="#b39cd5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="25" y="348" fill="#bfc3cc" font-size="12">LLM не принимает кредитное решение. Банковские интеграции, подпись и выдача смоделированы.</text></g></svg>