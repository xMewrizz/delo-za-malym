<svg xmlns="http://www.w3.org/2000/svg" width="900" height="365" viewBox="0 0 900 365" role="img" aria-labelledby="title"><title id="title">Основной путь заявки и альтернативные исходы</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#b39cd5" fill="none"/></marker></defs><rect width="900" height="365" rx="16" fill="#1b1e22"/><g font-family="Arial, sans-serif"><rect x="22" y="30" width="158" height="95" rx="12" fill="#25282e" stroke="#50555f"/><text x="38" y="59" fill="#f2f3f5" font-size="15" font-weight="600">Черновик</text><text x="38" y="83" fill="#bfc3cc" font-size="12">Потребность и данные</text><path d="M180,78 L202,78" stroke="#b39cd5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="202" y="30" width="158" height="95" rx="12" fill="#25282e" stroke="#8b6ab8"/><text x="218" y="59" fill="#c29dff" font-size="15" font-weight="600">Рассмотрение</text><text x="218" y="83" fill="#bfc3cc" font-size="12">Сведения и проверки</text><path d="M360,78 L382,78" stroke="#b39cd5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="382" y="30" width="158" height="95" rx="12" fill="#25282e" stroke="#50555f"/><text x="398" y="59" fill="#f2f3f5" font-size="15" font-weight="600">Предложения</text><text x="398" y="83" fill="#bfc3cc" font-size="12">Выбор и условия</text><path d="M540,78 L562,78" stroke="#b39cd5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="562" y="30" width="158" height="95" rx="12" fill="#25282e" stroke="#50555f"/><text x="578" y="59" fill="#f2f3f5" font-size="15" font-weight="600">Подписание</text><text x="578" y="83" fill="#bfc3cc" font-size="12">Проверка актуальности</text><path d="M720,78 L742,78" stroke="#b39cd5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="742" y="30" width="158" height="95" rx="12" fill="#25282e" stroke="#50555f"/><text x="758" y="59" fill="#f2f3f5" font-size="15" font-weight="600">Продукт</text><text x="758" y="83" fill="#bfc3cc" font-size="12">Выдача или лимит</text><rect x="22" y="205" width="194" height="88" rx="12" fill="#25282e" stroke="#50555f"/><text x="38" y="234" fill="#f2f3f5" font-size="15" font-weight="600">Уточнение</text><text x="38" y="258" fill="#bfc3cc" font-size="12">waiting_for_data</text><rect x="242" y="205" width="194" height="88" rx="12" fill="#25282e" stroke="#50555f"/><text x="258" y="234" fill="#f2f3f5" font-size="15" font-weight="600">Повтор проверки</text><text x="258" y="258" fill="#bfc3cc" font-size="12">check_retry_pending</text><rect x="462" y="205" width="194" height="88" rx="12" fill="#25282e" stroke="#50555f"/><text x="478" y="234" fill="#f2f3f5" font-size="15" font-weight="600">Отказ / вне правил</text><text x="478" y="258" fill="#bfc3cc" font-size="12">declined / out_of_policy</text><rect x="682" y="205" width="194" height="88" rx="12" fill="#25282e" stroke="#50555f"/><text x="698" y="234" fill="#f2f3f5" font-size="15" font-weight="600">Истечение условий</text><text x="698" y="258" fill="#bfc3cc" font-size="12">offer_expired</text><path d="M281,125 L120,205" stroke="#b39cd5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M281,125 L339,205" stroke="#b39cd5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M281,125 L559,205" stroke="#b39cd5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M641,125 L779,205" stroke="#b39cd5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="25" y="338" fill="#bfc3cc" font-size="12">Уточнения возвращают к данным; технические ошибки — к проверке. Альтернативы требуют выбора клиента.</text></g></svg>